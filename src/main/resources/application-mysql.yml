# =====================================================================
#  MySQL 环境配置：启动时加 --spring.profiles.active=mysql
#  需先建库： CREATE DATABASE flower_crawler DEFAULT CHARSET utf8mb4;
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flower_crawler?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
